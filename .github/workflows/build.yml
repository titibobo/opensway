name: Build OpenSway.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: python -m pytest -q tests

      - name: Compilation
        run: >
          pyinstaller --noconfirm --onefile --windowed --name OpenSway
          --icon assets/ESO_logo_square.png
          --splash assets/DR_splash.png
          --add-data "assets;assets"
          --hidden-import hid
          opensway.py

      - name: Vérification (module hid inclus dans le .exe)
        shell: pwsh
        run: |
          $hit = Select-String -Path build\OpenSway\*.toc -Pattern "'hid'" -SimpleMatch -Quiet
          if (-not $hit) { Write-Error "Module hid absent du .exe"; exit 1 }
          Write-Output "Module hid présent."

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSway-windows
          path: dist/OpenSway.exe

      - name: Publication (tags vX.Y)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OpenSway.exe
